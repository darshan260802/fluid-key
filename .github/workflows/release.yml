name: Build & Release APK

on:
  push:
    branches: [ "main", "master", "claude/**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Read version
        id: ver
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "FluidKey-v${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FluidKey-v${{ steps.ver.outputs.version }}
          path: FluidKey-v*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: FluidKey v${{ steps.ver.outputs.version }}
          body_path: release/NOTES.md
          files: FluidKey-v*.apk
          target_commitish: ${{ github.sha }}
          make_latest: true
